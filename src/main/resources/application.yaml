spring:
  application:
    name: Kafka-Manager
  profiles:
    default: prod
  devtools:
    restart:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: kafka-mgr-task-
    scheduling:
      pool:
        size: 2
      thread-name-prefix: kafka-mgr-scheduling-
resilience4j:
  circuitbreaker:
    instances:
      kafkaAdmin:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
        record-exceptions:
          - org.apache.kafka.common.errors.AuthenticationException
          - org.apache.kafka.common.errors.AuthorizationException
          - org.apache.kafka.common.errors.TimeoutException
          - java.util.concurrent.TimeoutException
          - java.io.IOException

server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    access:
      default: none
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,loggers,threaddump,env,configprops
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: always
    prometheus:
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true
logging:
  level:
    root: INFO
    com.opentext.security.analytics.messagehub.kafkamanager: INFO
    io.github.resilience4j: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  service-name: kafka-manager
  admin:
    bootstrap-servers: ${BOOTSTRAP_SERVERS_CONFIG:localhost:9092}
    security-protocol: ${KAFKA_ADMIN_SECURITY_PROTOCOL:PLAINTEXT}
    default-request-timeout: 5s
    default-operation-timeout: 30s
  metrics:
    broker-jmx:
      enabled: true
      poll-interval: 30s
    admin-derived:
      enabled: true
      poll-interval: 60s
      operation-timeout: 30s
      topic-exclusion-patterns: []
    prometheus-scrape:
      enabled: false
      diagnostics-enabled: false
  rate-limit:
    enabled: true
    capacity: 300
    refill-period: 1m
    key-header: X-Client-Id
