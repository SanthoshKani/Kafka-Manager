logging:
  level:
    com.opentext.security.analytics.messagehub.kafkamanager: DEBUG
app:
  rate-limit:
    enabled: false
  admin:
    bootstrap-servers: ${BOOTSTRAP_SERVERS_CONFIG:localhost:19092,localhost:29092,localhost:39092}
    security-protocol: PLAINTEXT
    default-request-timeout: 5s
    default-operation-timeout: 30s
