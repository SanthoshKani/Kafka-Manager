services:
  # ---------------------------------------------------------------------------
  # KRaft controllers
  # ---------------------------------------------------------------------------
  controller1:
    image: apache/kafka:4.2.0
    container_name: controller1
    hostname: controller1
    ports:
      - "19101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller1:9093,
        2@controller2:9093,
        3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller1-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-metadata-quorum.sh
          --bootstrap-controller localhost:9093
          describe --status >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  controller2:
    image: apache/kafka:4.2.0
    container_name: controller2
    hostname: controller2
    ports:
      - "19102:9101"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller1:9093,
        2@controller2:9093,
        3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller2-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-metadata-quorum.sh
          --bootstrap-controller localhost:9093
          describe --status >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  controller3:
    image: apache/kafka:4.2.0
    container_name: controller3
    hostname: controller3
    ports:
      - "19103:9101"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller1:9093,
        2@controller2:9093,
        3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller3-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-metadata-quorum.sh
          --bootstrap-controller localhost:9093
          describe --status >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka brokers
  # ---------------------------------------------------------------------------

  broker1:
    image: apache/kafka:4.2.0
    container_name: broker1
    hostname: broker1
    ports:
      # External Kafka listener
      - "19092:9094"
      # JMX
      - "19111:9101"
    environment:
      KAFKA_NODE_ID: 101
      KAFKA_PROCESS_ROLES: broker
      # Internal traffic uses port 9092.
      # External traffic uses port 9094 inside the container.
      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:9094
      # KAFKA_HOST_IP can be provided through the shell or a .env file.
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://broker1:9092,
        EXTERNAL://${KAFKA_HOST_IP}:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller1:9093,
        2@controller2:9093,
        3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_JMX_PORT: 9101
       KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker1-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092
          >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy
    restart: unless-stopped
  broker2:
    image: apache/kafka:4.2.0
    container_name: broker2
    hostname: broker2
    ports:
      # External Kafka listener
      - "29092:9094"
      # JMX
      - "19112:9101"
    environment:
      KAFKA_NODE_ID: 102
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://broker2:9092,
        EXTERNAL://${KAFKA_HOST_IP}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller1:9093,
        2@controller2:9093,
        3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_JMX_PORT: 9101
       KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker2-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092
          >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy
    restart: unless-stopped
  broker3:
    image: apache/kafka:4.2.0
    container_name: broker3
    hostname: broker3
    ports:
      # External Kafka listener
      - "39092:9094"
      # JMX
      - "19113:9101"
    environment:
      KAFKA_NODE_ID: 103
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://broker3:9092,
        EXTERNAL://${KAFKA_HOST_IP}:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller1:9093,
        2@controller2:9093,
        3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_JMX_PORT: 9101
       KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker3-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092
          >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Persistent Docker volumes
# -----------------------------------------------------------------------------

volumes:
  controller1-data:
  controller2-data:
  controller3-data:
  broker1-data:
  broker2-data:
  broker3-data:

# NOTES:
# - Replace 10.71.135.15 above with the server's public/private IP that clients
#   will use to reach Kafka. If the server has multiple interfaces, use the one
#   reachable by your development machine.
# - Ensure firewall allows the external ports: 19092,29092,39092 (broker client ports),
#   19093,29093,39093 (controller ports), and JMX ports if needed.
# - Run on the remote host:
#     docker compose -f external-compose.yaml up -d
# - The local application should be configured to use bootstrap servers:
#     10.71.135.15:19092,10.71.135.15:29092,10.71.135.15:39092
# - If you run the application locally (IDE), set SPRING_PROFILES_ACTIVE=local and
#   override the bootstrap servers as described in the developer guide.

