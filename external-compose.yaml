# External Docker Compose for running on a remote host (e.g. 10.71.135.15)
# This file is adapted from compose.yaml but intended to be run on a server
# that applications (IDE / local machine) will connect to remotely.
# - Do NOT run `kafka-manager` inside this compose when you want to connect
#   from your local IDE. Run the application locally and point it to the
#   remote bootstrap servers.

version: '3.8'

services:
  # Dedicated Controllers (KRaft quorum)
  controller1:
    image: apache/kafka:4.2.0
    container_name: controller1
    ports:
      - "19093:9093"   # controller API port (mapped to host)
      - "19101:9101"   # JMX
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: controller1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  controller2:
    image: apache/kafka:4.2.0
    container_name: controller2
    ports:
      - "29093:9093"
      - "19102:9101"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: controller2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  controller3:
    image: apache/kafka:4.2.0
    container_name: controller3
    ports:
      - "39093:9093"
      - "19103:9101"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: controller3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Brokers (data plane only)
  # These brokers will advertise both the internal Docker network hostnames
  # (broker1:9092, broker2:9092, broker3:9092) and an EXTERNAL listener
  # using the server's public IP (replace 10.71.135.15 below with your host IP).

  broker1:
    image: apache/kafka:4.2.0
    container_name: broker1
    ports:
      - "19092:9092"   # host 19092 -> container 9092
      - "19111:9101"
    environment:
      KAFKA_NODE_ID: 101
      KAFKA_PROCESS_ROLES: broker
      # Bind two listener names to the same container port; EXTERNAL will be
      # advertised using the server's host IP + mapped host port (19092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092,EXTERNAL://10.71.135.15:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: broker1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy

  broker2:
    image: apache/kafka:4.2.0
    container_name: broker2
    ports:
      - "29092:9092"
      - "19112:9101"
    environment:
      KAFKA_NODE_ID: 102
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092,EXTERNAL://10.71.135.15:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: broker2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy

  broker3:
    image: apache/kafka:4.2.0
    container_name: broker3
    ports:
      - "39092:9092"
      - "19113:9101"
    environment:
      KAFKA_NODE_ID: 103
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9092,EXTERNAL://10.71.135.15:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: broker3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy

volumes:
  controller1-data:
  controller2-data:
  controller3-data:
  broker1-data:
  broker2-data:
  broker3-data:

# NOTES:
# - Replace 10.71.135.15 above with the server's public/private IP that clients
#   will use to reach Kafka. If the server has multiple interfaces, use the one
#   reachable by your development machine.
# - Ensure firewall allows the external ports: 19092,29092,39092 (broker client ports),
#   19093,29093,39093 (controller ports), and JMX ports if needed.
# - Run on the remote host:
#     docker compose -f external-compose.yaml up -d
# - The local application should be configured to use bootstrap servers:
#     10.71.135.15:19092,10.71.135.15:29092,10.71.135.15:39092
# - If you run the application locally (IDE), set SPRING_PROFILES_ACTIVE=local and
#   override the bootstrap servers as described in the developer guide.

