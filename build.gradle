plugins {
    id 'java'
    id 'idea'
    id 'distribution'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '3.3.0'
    id 'com.diffplug.spotless' version '8.9.0'
    id 'com.github.ben-manes.versions' version '0.52.0'
    id 'org.owasp.dependencycheck' version '12.1.8'
}

group = 'com.opentext.security.analytics.messagehub'
version = '1.0.0'
description = 'Kafka-Manager'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2025.1.2')
    set('springDocVersion', '2.8.13')
    set('bucket4jVersion', '8.10.1')
    set('resilience4jVersion', '2.2.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.apache.kafka:kafka-clients'
    implementation "io.micrometer:micrometer-registry-prometheus"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.bouncycastle:bctls-fips:2.1.24'
    implementation 'org.bouncycastle:bc-fips:2.1.3'
    implementation 'org.bouncycastle:bcutil-fips:2.1.7'

    // Rate limiting with Bucket4j (core library)
    implementation "com.bucket4j:bucket4j-core:${bucket4jVersion}"

    // Circuit breaker with Resilience4j
    implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"
    implementation "io.github.resilience4j:resilience4j-micrometer:${resilience4jVersion}"

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

spotless {
    java {
        target('src/**/*.java')
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('check') {
    finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
    dependsOn tasks.named('test')
    executionData fileTree(layout.buildDirectory).include('jacoco/test.exec')
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

jacoco {
    toolVersion = '0.8.14'
}

dependencyCheck {
    failBuildOnCVSS = 8.0
    suppressionFile = "${projectDir}/dependency-check-suppressions.xml"
}
