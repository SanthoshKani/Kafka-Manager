services:
  # Dedicated Controllers (KRaft quorum)
  controller1:
    image: apache/kafka:4.2.0
    container_name: controller1
    ports:
      - "19093:9093"
      - "19101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP:-10.71.135.15}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  controller2:
    image: apache/kafka:4.2.0
    container_name: controller2
    ports:
      - "29093:9093"
      - "19102:9101"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP:-10.71.135.15}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  controller3:
    image: apache/kafka:4.2.0
    container_name: controller3
    ports:
      - "39093:9093"
      - "19103:9101"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP:-10.71.135.15}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - controller3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # Brokers (data plane only)
  broker1:
    image: apache/kafka:4.2.0
    container_name: broker1
    ports:
      - "19092:9092"
      - "19111:9101"
    environment:
      KAFKA_NODE_ID: 101
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP:-10.71.135.15}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy

  broker2:
    image: apache/kafka:4.2.0
    container_name: broker2
    ports:
      - "29092:9092"
      - "19112:9101"
    environment:
      KAFKA_NODE_ID: 102
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP:-10.71.135.15}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy

  broker3:
    image: apache/kafka:4.2.0
    container_name: broker3
    ports:
      - "39092:9092"
      - "19113:9101"
    environment:
      KAFKA_NODE_ID: 103
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      JMX_PORT: 9101
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: ${KAFKA_HOST_IP:-10.71.135.15}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - broker3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      controller1:
        condition: service_healthy
      controller2:
        condition: service_healthy
      controller3:
        condition: service_healthy

  kafka-manager:
    build: .
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      BOOTSTRAP_SERVERS_CONFIG: broker1:9092,broker2:9092,broker3:9092
      APP_METRICS_ADMIN_DERIVED_POLL_INTERVAL: 60s
    ports:
      - "8080:8080"

volumes:
  controller1-data:
  controller2-data:
  controller3-data:
  broker1-data:
  broker2-data:
  broker3-data:
